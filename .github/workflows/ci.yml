name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 数据质量闸门
        run: npm run data:check
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm run test
      # Prerender needs a browser. On CI we point CHROME_PATH at the runner's Chrome,
      # or the build skips prerendering with a warning (still deployable).
      - name: 构建
        run: npm run build
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
